name: BattleForge full-history secret scan
on:
  push:
    branches: ["security/hardening-2026-11-27"]
  pull_request:
    branches: ["security/hardening-2026-11-27"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: battleforge-secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan-all-git-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install and verify TruffleHog
        shell: bash
        run: |
          set -euo pipefail
          version="3.100.1"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${version}"
          curl -fsSLo trufflehog_checksums.txt "${base}/trufflehog_${version}_checksums.txt"
          archive="trufflehog_${version}_linux_amd64.tar.gz"
          curl -fsSLo "${archive}" "${base}/${archive}"
          grep "${archive}" trufflehog_checksums.txt > trufflehog_linux_amd64.sha256
          sha256sum -c trufflehog_linux_amd64.sha256
          tar -xzf "${archive}" trufflehog
          chmod +x trufflehog
      - name: Scan every reachable commit without printing secret values
        shell: bash
        run: |
          set +e
          ./trufflehog git "file://${GITHUB_WORKSPACE}" --json --no-update --fail --fail-on-scan-errors --results=verified,unverified,unknown > "${RUNNER_TEMP}/trufflehog-results.jsonl"
          scan_status=$?
          set -e
          if [ -s "${RUNNER_TEMP}/trufflehog-results.jsonl" ]; then
            jq -c 'del(.Raw, .RawV2, .ExtraData, .Secret, .Token, .Redacted)' "${RUNNER_TEMP}/trufflehog-results.jsonl"
          fi
          exit "${scan_status}"
