name: BattleForge full-history secret scan
on:
  push:
    branches: ["security/hardening-2026-11-27"]
  pull_request:
    branches: ["security/hardening-2026-11-27"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: battleforge-secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan-all-git-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout app security branch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout default branch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: history/main
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout app release branch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/payment-minimums-earned-withdrawal-policy
          path: history/feature-app
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout production website branch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: design/apple-inspired-battleforge
          path: history/production-website
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout latest APK release branch history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/1.2.1
          path: history/apk-release
          fetch-depth: 0
          persist-credentials: false
      - name: Install and verify TruffleHog
        shell: bash
        run: |
          set -euo pipefail
          version="3.100.1"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${version}"
          curl -fsSLo trufflehog_checksums.txt "${base}/trufflehog_${version}_checksums.txt"
          archive="trufflehog_${version}_linux_amd64.tar.gz"
          curl -fsSLo "${archive}" "${base}/${archive}"
          grep "${archive}" trufflehog_checksums.txt > trufflehog_linux_amd64.sha256
          sha256sum -c trufflehog_linux_amd64.sha256
          tar -xzf "${archive}" trufflehog
          chmod +x trufflehog
      - name: Scan complete branch histories without printing secret values
        shell: bash
        run: |
          set -u
          scan_status=0
          scan_repo() {
            name="$1"
            path="$2"
            output="${RUNNER_TEMP}/trufflehog-${name}.jsonl"
            set +e
            ./trufflehog git "file://${path}" --json --no-update --fail --fail-on-scan-errors --results=verified,unverified,unknown > "${output}"
            status=$?
            set -e
            if [ -s "${output}" ]; then
              jq -c 'del(.Raw, .RawV2, .ExtraData, .Secret, .Token, .Redacted)' "${output}"
            fi
            if [ "${status}" -ne 0 ]; then scan_status="${status}"; fi
          }
          scan_repo app-security "${GITHUB_WORKSPACE}"
          scan_repo main "${GITHUB_WORKSPACE}/history/main"
          scan_repo feature-app "${GITHUB_WORKSPACE}/history/feature-app"
          scan_repo production-website "${GITHUB_WORKSPACE}/history/production-website"
          scan_repo apk-release "${GITHUB_WORKSPACE}/history/apk-release"
          exit "${scan_status}"
