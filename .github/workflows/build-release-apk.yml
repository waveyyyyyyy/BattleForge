name: Build signed BattleForge Android release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub Actions secret: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Create a release keystore and add all four required secrets. See docs/LAUNCH_READINESS.md."
            exit 1
          fi
      - name: Install dependencies
        run: npm install
      - name: Assign a unique app version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          p=Path("package.json")
          data=json.loads(p.read_text())
          parts=data["version"].split(".")
          if len(parts)<2: raise SystemExit("package.json version must be major.minor.patch")
          version=f"{int(parts[0])}.{int(parts[1])}.{int(os.environ['BUILD_NUMBER'])}"
          data["version"]=version
          p.write_text(json.dumps(data,indent=2)+"\n")
          app=Path("app.js")
          source,count=re.subn(r"const APP_FALLBACK_VERSION='[^']+';",f"const APP_FALLBACK_VERSION='{version}';",app.read_text(),count=1)
          if count!=1: raise SystemExit("Could not update runtime fallback version")
          app.write_text(source)
          parts=[int(x) for x in version.split(".")]
          code=parts[0]*100000000+parts[1]*1000000+parts[2]
          if code>2100000000: raise SystemExit("Android versionCode exceeds supported range")
          Path("release-version.txt").write_text(f"{version} {code}\n")
          print(f"Release version: {version} ({code})")
          PY
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Prepare launcher icon
        run: |
          python -m pip install --user Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Path("IMG_20261023_162105_815.jpg")
          if not source.exists(): raise SystemExit("BattleForge launcher icon source is missing")
          image=Image.open(source).convert("RGB")
          w,h=image.size
          side=min(w,h)
          image=image.crop(((w-side)//2,(h-side)//2,(w+side)//2,(h+side)//2)).resize((1024,1024),Image.Resampling.LANCZOS)
          Path("assets").mkdir(exist_ok=True)
          image.save("assets/icon.png",optimize=True)
          PY
          npx --yes @capacitor/assets generate --android
      - name: Sync Android project
        run: npx cap sync android
      - name: Configure Firebase push credentials when available
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "::warning::Firebase push credentials are missing; release can build, but push notifications will not work."
          fi
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/battleforge-upload.jks"
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          block='''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs {" not in s:
              s,n=re.subn(r'(android\s*\{)',r'\1\n'+block,s,count=1)
              if n!=1: raise SystemExit("Could not add Android release signing configuration")
          s,n=re.subn(r'(buildTypes\s*\{\s*release\s*\{)',r'\1\n            signingConfig signingConfigs.release',s,count=1)
          if n!=1: raise SystemExit("Could not attach release signing config to buildTypes.release")
          p.write_text(s)
          PY
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/battleforge-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease
      - name: Verify APK signature and record checksum
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee release-apk-sha256.txt
          cat release-version.txt
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleForge-signed-release-APK
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            release-apk-sha256.txt
            release-version.txt
          if-no-files-found: error
