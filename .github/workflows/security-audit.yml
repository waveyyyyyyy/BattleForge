name: BattleForge security audit
on:
  push:
    branches: ["security/hardening-2026-11-27", "feature/payment-minimums-earned-withdrawal-policy", "main"]
  pull_request:
    branches: ["security/hardening-2026-11-27"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: battleforge-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build web application
        run: npm run build
