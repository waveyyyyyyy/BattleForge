name: Build BattleForge Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Prepare BattleForge launcher icon
        run: |
          python -m pip install --user Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("IMG_20261023_162105_815.jpg")
          if not source.exists():
              raise SystemExit("Uploaded BattleForge icon image was not found in the repository root.")
          image = Image.open(source).convert("RGB")
          width, height = image.size
          side = min(width, height)
          left = (width - side) // 2
          top = (height - side) // 2
          image = image.crop((left, top, left + side, top + side))
          image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          Path("assets").mkdir(exist_ok=True)
          image.save("assets/icon.png", optimize=True)
          PY
          npx --yes @capacitor/assets generate --android
      - name: Sync app
        run: npx cap sync android
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleForge-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
