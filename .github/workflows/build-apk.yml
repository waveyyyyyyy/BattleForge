name: Build BattleForge Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, "feature/payment-minimums-earned-withdrawal-policy"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Set Android version from package.json
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          version = json.loads(Path("package.json").read_text())["version"]
          parts = [int(part) for part in version.split(".")]
          parts += [0] * (3 - len(parts))
          # Monotonically increases for normal major.minor.patch releases.
          version_code = parts[0] * 1000000 + parts[1] * 1000 + parts[2]
          path = Path("android/app/build.gradle")
          gradle = path.read_text()
          if not re.search(r"\bversionCode\s+\d+", gradle):
              raise SystemExit("Could not find Android versionCode in generated build.gradle")
          if not re.search(r"\bversionName\s+[\"'][^\"']+[\"']", gradle):
              raise SystemExit("Could not find Android versionName in generated build.gradle")
          gradle = re.sub(r"\bversionCode\s+\d+", f"versionCode {version_code}", gradle, count=1)
          gradle = re.sub(r"\bversionName\s+[\"'][^\"']+[\"']", f'versionName "{version}"', gradle, count=1)
          path.write_text(gradle)
          print(f"Configured Android versionName={version}, versionCode={version_code}")
          PY
      - name: Register native OAuth callback deep link
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(path)
          root = tree.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          activity = None
          for node in root.iter('activity'):
              if any(a.get(ns + 'name') == 'android.intent.action.MAIN' for a in node.findall('./intent-filter/action')):
                  activity = node
                  break
          if activity is None:
              raise SystemExit('Could not find the launcher activity in AndroidManifest.xml')
          for f in activity.findall('intent-filter'):
              data = f.find('data')
              if data is not None and data.get(ns + 'scheme') == 'com.battleforge.arena':
                  break
          else:
              f = ET.SubElement(activity, 'intent-filter')
              ET.SubElement(f, 'action', {ns + 'name': 'android.intent.action.VIEW'})
              ET.SubElement(f, 'category', {ns + 'name': 'android.intent.category.DEFAULT'})
              ET.SubElement(f, 'category', {ns + 'name': 'android.intent.category.BROWSABLE'})
              ET.SubElement(f, 'data', {ns + 'scheme': 'com.battleforge.arena', ns + 'host': 'auth', ns + 'pathPrefix': '/callback'})
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY
      - name: Prepare BattleForge launcher icon
        run: |
          python -m pip install --user Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("IMG_20261023_162105_815.jpg")
          if not source.exists():
              raise SystemExit("Uploaded BattleForge icon image was not found in the repository root.")
          image = Image.open(source).convert("RGB")
          width, height = image.size
          side = min(width, height)
          left = (width - side) // 2
          top = (height - side) // 2
          image = image.crop((left, top, left + side, top + side))
          image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          Path("assets").mkdir(exist_ok=True)
          image.save("assets/icon.png", optimize=True)
          PY
          npx --yes @capacitor/assets generate --android
      - name: Sync app
        run: npx cap sync android
      - name: Configure Firebase for Android push notifications
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::Firebase is not configured yet. APK will build, but real push notifications will not work until GOOGLE_SERVICES_JSON_BASE64 is added."
          else
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleForge-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
